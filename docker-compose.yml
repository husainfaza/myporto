services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: developer-portfolio:latest
    container_name: portfolio-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    networks:
      - portfolio

  nginx:
    image: nginx:1.27-alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      # - "443:443"   # uncomment after wiring TLS certs below
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro   # mount TLS certs here
    networks:
      - portfolio

networks:
  portfolio:
    driver: bridge
